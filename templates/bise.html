{% load static %}

<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">

  <title>MOO BOOK</title>
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="{% static 'dist/css/adminlte_ar.min.css' %}">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
</head>

<body dir="rtl" class="hold-transition sidebar-mini">

  {% include 'partes/nav.html' %}
  {% include 'partes/sidbare.html' %}

  {% block content %}
  {% endblock content %}

  {% include 'partes/footer.html' %}
  </div>

  <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'dist/js/adminlte.js' %}"></script>
  <script src="{% static 'plugins/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'dist/js/demo.js' %}"></script>

  <!-- الفلترة -->
  <script>
    $(document).ready(function () {
      var currentCat = 'all';
      var currentStatus = 'all';

      function applyFilters() {
        $('.bookhide').each(function () {
          var okCat = currentCat === 'all' ||
            String($(this).attr('data-category')) === currentCat;
          var okStatus = currentStatus === 'all' ||
            $(this).attr('data-status') === currentStatus;
          $(this).toggle(okCat && okStatus);
        });
      }

      $('.cat-filter').on('click', function (e) {
        e.preventDefault();
        currentCat = String($(this).attr('data-category'));
        if (currentCat === 'all') currentStatus = 'all';
        applyFilters();
      });

      $('.status-filter').on('click', function (e) {
        e.preventDefault();
        var clicked = $(this).attr('data-status');
        currentStatus = (currentStatus === clicked) ? 'all' : clicked;
        applyFilters();
      });
    });


  </script>



  <script>

    <!-- حساب الارباح  -->

    $(document).ready(function () {
      var profit = 0

      $('.totalprice').each(function() {
        $(this).hide()
        var total = $(this).text()
        profit += parseFloat(total)
      });

      $("#totalsalarys").text(profit + " EGP")

    });

    <!-- المستأجرة الكتب حساب  -->

    var total1 = 0
    $('.totalrenter').each(function() {
      $(this).hide()
      var profit1 = $(this).text()
      total1 += parseFloat(profit1)
    });

    $('.salaryrenter').text(total1)
    $('.salaryrenter').hide()



    <!-- المباعة الكتب حساب  -->

    var total2 = 0
    $('.totalsolad').each(function() {
      $(this).hide()
      var profit2 = $(this).text()
      total2 += parseFloat(profit2)
    });

    $('.salarysolad').text(total2)
    $('.salarysolad').hide()





    <!-- حساب الايجار اليومي  -->

    $("#rentalpriceday , #rentalperiod").on("input", function () {

      var total = ($("#rentalperiod").val() || 0) * ($("#rentalpriceday").val() || 0)

      $("#rentaltotal").val(total)

    });

  </script>





  <!-- الشارتس -->
  <script>
    $(function () {
      'use strict'

      var ticksStyle = {
        fontColor: '#495057',
        fontStyle: 'bold'
      }

      var mode = 'index'
      var intersect = true

      var $salesChart = $('#sales-chart')

      if ($salesChart.length) {
        new Chart($salesChart, {
          type: 'bar',
          data: {
            labels: ['تفاصيل الارباح'],
            datasets: [
              { backgroundColor: '#007bff', borderColor: '#007bff', data: [$('.salarysolad').text()] },
              { backgroundColor: '#ced4da', borderColor: '#ced4da', data: [$('.salaryrenter').text()] }
            ]
          },
          options: {
            maintainAspectRatio: false,
            tooltips: { mode: mode, intersect: intersect },
            hover: { mode: mode, intersect: intersect },
            legend: { display: false },
            scales: {
              yAxes: [{
                gridLines: {
                  display: true,
                  lineWidth: '4px',
                  color: 'rgba(0, 0, 0, .2)',
                  zeroLineColor: 'transparent'
                },
                ticks: $.extend({
                  beginAtZero: true,
                  callback: function (value) {
                    if (value >= 1000) { value /= 1000; value += 'k' }
                    return '$' + value
                  }
                }, ticksStyle)
              }],
              xAxes: [{
                display: true,
                gridLines: { display: false },
                ticks: ticksStyle
              }]
            }
          }
        });
      }

      var pieEl = document.getElementById('visitors-chart')
      if (pieEl) {
        new Chart(pieEl.getContext('2d'), {
          type: 'pie',
          data: {
            datasets: [{
              data: ['{{book_available}}', '{{book_Sold}}', '{{book_renter}}'],
              backgroundColor: ["#27c100", "#f3545d", "#fdaf4b"],
              borderWidth: 10,
            }],
            labels: ['متاح', 'تم بيعة', 'مستأجر']
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            legend: {
              position: 'bottom',
              labels: { fontColor: '#000', fontSize: 15, usePointStyle: true, padding: 30 }
            }
          }
        })
      }
    })
  </script>

</body>

</html>
