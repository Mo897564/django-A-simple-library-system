<aside style="position: fixed;" class="main-sidebar sidebar-dark-primary elevation-4">
  <!-- Brand Logo -->
  <a href="#" class="brand-link">
    <span class="brand-text font-weight-light">MOO BOOK</span>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="user-panel mt-3 pb-3 mb-3 d-flex">
      <div class="image"></div>
      <div class="info">
        <a href="#" class="d-block">Mostafa Ahmed</a>
      </div>
    </div>

    <!-- Sidebar Menu -->
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

        <li class="nav-item">
          <a href="{% url 'books' %}" class="nav-link">
            <i class="nav-icon fas fa-th"></i>
            <p>صفحة الكتب</p>
          </a>
        </li>

        <li class="nav-item has-treeview">
          <a href="#" class="nav-link">
            <i class="nav-icon fas fa-copy"></i>
            <p>
              التصنيفات
              <i class="fas fa-angle-left right"></i>
            </p>
          </a>
          <ul class="nav nav-treeview">

            <li class="nav-item">
              <a id="addcat" href="#" class="nav-link">
                <i class="fa fa-plus "></i>
                <p class="text-light"> اضافة تصنيف</p>
              </a>
            </li>

            <form id="cat" method="POST">
              {% csrf_token %}
              {{ formcat }}
              <button type="submit" class="btn btn-success">حفظ</button>
              <button type="button" id="backcat" class="btn btn-primary">للخلف</button>
            </form>

            <!-- كل الكتب -->
            <li style="cursor: pointer;" class="nav-item">
              <a href="#" class="nav-link cat-filter" data-category="all">
                <i class="far fa-circle nav-icon"></i>
                <p>كل الكتب</p>
              </a>
            </li>

            {% for cat in Category %}
            <li style="cursor: pointer;" class="nav-item">
              <a href="#" class="nav-link cat-filter" data-category="{{ cat.id }}">
                <i class="far fa-circle nav-icon"></i>
                <p>{{ cat.name }}</p>
              </a>
            </li>
            {% endfor %}

          </ul>
        </li>

        <li class="nav-header">حالة الكتب</li>

        <li style="cursor: pointer;" class="nav-item">
          <a href="#" class="nav-link status-filter" data-status="تم بيعة">
            <i class="nav-icon far fa-circle text-danger"></i>
            <p>تم بيعة</p>
          </a>
        </li>
        <li style="cursor: pointer;" class="nav-item">
          <a href="#" class="nav-link status-filter" data-status="مستأجر">
            <i class="nav-icon far fa-circle text-warning"></i>
            <p>مستأجر</p>
          </a>
        </li>
        <li style="cursor: pointer;" class="nav-item">
          <a href="#" class="nav-link status-filter" data-status="متاح">
            <i class="nav-icon far fa-circle text-success"></i>
            <p>متاح</p>
          </a>
        </li>

      </ul>
    </nav>
  </div>
</aside>
